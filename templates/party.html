{% extends 'base.html' %}{% block content %}<div class="planner"><span class="pill">PARTY PLANNER</span><h1>Party Budget Planner</h1><form id="partyForm"><label>Total budget (₹)<input name="budget" type="number" min="1" required></label><label>Guest count<input name="guests" type="number" min="1" required></label><label>Event type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Anniversary</option></select></label><label>Venue<input name="venue" placeholder="Home / Hall / Outdoor"></label><label>City<input name="city" placeholder="Chennai / Trichy / Tenkasi"></label><label>Preferences<input name="preferences" placeholder="veg food, music, simple decor"></label><button class="btn">Generate Recommendations</button></form><div id="result" class="results"></div></div>{% endblock %}
