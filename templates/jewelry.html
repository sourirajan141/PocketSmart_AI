{% extends 'base.html' %}{% block content %}<div class="planner"><span class="pill">JEWELRY PLANNER</span><h1>Jewelry Budget Planner</h1><form id="jewelryForm" enctype="multipart/form-data"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Occasion<select name="occasion"><option>Wedding</option><option>Birthday</option><option>Party</option><option>Festival</option><option>Formal</option></select></label><label>Style<select name="style"><option>Elegant</option><option>Traditional</option><option>Minimal</option><option>Statement</option></select></label><label>Outfit color<input name="outfit_color" placeholder="Optional, e.g. maroon"></label><label>Preferences<input name="preferences" placeholder="gold tone, lightweight"></label><label>Optional outfit image<input name="outfit_image" type="file" accept="image/*"></label><button class="btn">Generate Recommendations</button></form><div id="result" class="results"></div></div>{% endblock %}
